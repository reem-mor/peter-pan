name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        # llm + agents included so mypy strict sees real types for anthropic /
        # langgraph (lazy imports in llm.py, dashboard.py, agents/graph.py).
        run: pip install -e ".[dev,llm,agents]"
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .
      - name: Types
        run: mypy src
      - name: Tests (with coverage)
        run: pytest -q --cov=src/peterpan --cov-report=xml
      - name: Coverage gate — >=80% on changed lines
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin ${{ github.base_ref }}
          diff-cover coverage.xml --compare-branch origin/${{ github.base_ref }} --fail-under=80
      - name: Compose config check
        run: docker compose config --quiet

  evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev,agents]"
      - name: Deterministic story eval (fixture path, no keys)
        run: python evals/run_story_eval.py

  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secret scan (gitleaks)
        # v2.3.9, pinned by SHA for supply-chain integrity
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_SUMMARY: "true"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependency vulnerability scan (pip-audit)
        run: |
          pip install pip-audit
          pip install -e ".[dev,llm,agents,rag,ui]"
          pip-audit --skip-editable

  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: docker compose build
      - name: Boot ppos (and its mesh deps) and wait for healthy
        run: |
          docker compose up -d
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8005/healthz; then
              echo "ppos is healthy"
              exit 0
            fi
            sleep 2
          done
          echo "ppos never became healthy" >&2
          docker compose logs
          exit 1
      - name: Compose down
        if: always()
        run: docker compose down -v
