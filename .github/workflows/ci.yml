name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        # llm + agents included so mypy strict sees real types for anthropic /
        # langgraph (lazy imports in llm.py, dashboard.py, agents/graph.py).
        run: pip install -e ".[dev,llm,agents]"
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .
      - name: Types
        run: mypy src
      - name: Tests
        run: pytest -q
      - name: Compose config check
        run: docker compose config --quiet
