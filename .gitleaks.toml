# Gitleaks config — extends default rules with triaged false-positive allowlist.
# Every entry here must state WHY it is safe; never allowlist a real secret.

[extend]
useDefault = true

[allowlist]
description = "Triaged false positives"
paths = [
    # Graphify's local cache: file-stat index of SHA-256 content hashes.
    # Verified 2026-07-18 (PR #33): hex digests only, no credentials. The
    # directory is gitignored going forward; this entry covers the one
    # pre-cleanup commit in branch history.
    '''graphify-out/cache/.*''',
    # Guardrail adversarial fixtures: secret-SHAPED synthetic strings are the
    # test vectors for detect_secret_leak (AKIA..., sk-..., password=...).
    # Verified 2026-07-18 (PR #37): synthetic only, also marked gitleaks:allow
    # inline. A secret-leak detector's tests will always trip a secret scanner.
    '''tests/test_nemo_rails.py''',
    # Same class of fixture: the prompt-log secret-scrubber's adversarial
    # inputs (password=hunter2, sk-..., ghp_...) are secret-shaped synthetic
    # strings by design. Verified 2026-07-18 (PR #41): synthetic only.
    '''tests/test_observability.py''',
]
