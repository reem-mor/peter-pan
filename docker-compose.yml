services:
  # Opt-in (ADR-0001): no other service depends_on this. Set PP_REDIS_URL on a
  # service's environment (e.g. "redis://redis:6379/0") to use it; unset, the
  # service falls back to its in-process cache/queue automatically.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
  predictor:
    build: .
    environment:
      SERVICE: predictor
      PP_ENV: "${PP_ENV:-mirage}"
      PP_USAGE_LOG_PATH: /app/usage-shared/usage.jsonl
      # Local compose stays open by default (fixture-first). Do NOT bind host
      # PP_API_TOKEN here — docker compose auto-loads .env and would harden the
      # demo mesh whenever a deploy token is present. Opt-in:
      #   $env:PP_COMPOSE_API_TOKEN = "<token>"; docker compose up -d
      PP_API_TOKEN: "${PP_COMPOSE_API_TOKEN:-}"
    ports: ["8001:8000"]
    volumes: ["usage-data:/app/usage-shared"]
    restart: unless-stopped
  rag:
    build: .
    environment:
      SERVICE: rag
      PP_ENV: "${PP_ENV:-mirage}"
      PP_USAGE_LOG_PATH: /app/usage-shared/usage.jsonl
      PP_API_TOKEN: "${PP_COMPOSE_API_TOKEN:-}"
      PP_RAG_BACKEND: "${PP_RAG_BACKEND:-lexical}"
      PINECONE_API_KEY: "${PINECONE_API_KEY:-}"
      VOYAGE_API_KEY: "${VOYAGE_API_KEY:-}"
    ports: ["8002:8000"]
    volumes:
      # Memory feed persistence: fed incident docs land on the host, not in the
      # ephemeral container layer (POST /memory would otherwise vanish on restart).
      - ./knowledge:/app/knowledge
      - usage-data:/app/usage-shared
    restart: unless-stopped
  guardrails:
    build: .
    environment:
      SERVICE: guardrails
      PP_ENV: "${PP_ENV:-mirage}"
      PP_USAGE_LOG_PATH: /app/usage-shared/usage.jsonl
      PP_API_TOKEN: "${PP_COMPOSE_API_TOKEN:-}"
    ports: ["8003:8000"]
    volumes: ["usage-data:/app/usage-shared"]
    restart: unless-stopped
  agent:
    build: .
    environment:
      SERVICE: agent
      PP_ENV: "${PP_ENV:-mirage}"
      PP_USAGE_LOG_PATH: /app/usage-shared/usage.jsonl
      PP_API_TOKEN: "${PP_COMPOSE_API_TOKEN:-}"
      # LLM opt-in passthrough — default off keeps the demo path fixture-first.
      # anthropic: export ANTHROPIC_API_KEY before `docker compose up`.
      # bedrock:   export AWS_REGION + credentials (or use an SSO profile via
      #            an ~/.aws read-only bind mount — AWS_REGION must still be
      #            exported: the empty passthrough below shadows the profile's
      #            region). No Anthropic key needed.
      # Empty values are safe: boto3 skips empty AWS_* vars, and an empty
      # ANTHROPIC_API_KEY fails closed into the deterministic fallback.
      PP_LLM: "${PP_LLM:-off}"
      # Keep in sync with the config.py default — compose must re-state it
      # because an empty passthrough would otherwise override the default.
      PP_BEDROCK_MODEL_ID: "${PP_BEDROCK_MODEL_ID:-us.anthropic.claude-sonnet-4-5-20250929-v1:0}"
      AWS_REGION: "${AWS_REGION:-}"
      AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID:-}"
      AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY:-}"
      AWS_SESSION_TOKEN: "${AWS_SESSION_TOKEN:-}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
    ports: ["8004:8000"]
    volumes:
      # agent-data: prompt_log.jsonl (§6.6) must survive container recreation,
      # same rationale as the shared usage volume. Per-service volume (not
      # shared with ppos) so neither service can touch the other's data files.
      - usage-data:/app/usage-shared
      - agent-data:/app/data
    restart: unless-stopped
  ppos:
    build: .
    environment:
      SERVICE: ppos
      PP_ENV: "${PP_ENV:-mirage}"
      PP_USAGE_LOG_PATH: /app/usage-shared/usage.jsonl
      PP_API_TOKEN: "${PP_COMPOSE_API_TOKEN:-}"
      # Mesh healthz targets for /os/services — compose DNS names, in-container port.
      PP_MESH: '{"predictor": "http://predictor:8000", "rag": "http://rag:8000", "guardrails": "http://guardrails:8000", "agent": "http://agent:8000"}'
    ports: ["8005:8000"]
    volumes:
      # ppos-data: feedback.jsonl + leads.jsonl are stateful product data —
      # they must not vanish on docker compose down / image rebuild. Per-service
      # volume (not shared with agent) so neither can touch the other's files.
      - usage-data:/app/usage-shared
      - ppos-data:/app/data
    restart: unless-stopped
    depends_on:
      predictor:
        condition: service_started
      rag:
        condition: service_started
      guardrails:
        condition: service_started
      agent:
        condition: service_started

volumes:
  usage-data:
  agent-data:
  ppos-data:
