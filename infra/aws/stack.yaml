AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  PETER PAN demo stack: one EC2 instance running the five services from ECR.
  No SSH ingress (SSM Session Manager only); service ports restricted to two
  allowlisted CIDRs. Delete the stack to tear everything down.

Parameters:
  DevIp:
    Type: String
    Description: Developer public IP in CIDR form (x.x.x.x/32)
    AllowedPattern: '^(\d{1,3}\.){3}\d{1,3}/32$'
    ConstraintDescription: Must be a single host CIDR (x.x.x.x/32)
  N8nIp:
    Type: String
    Description: n8n egress IP in CIDR form (x.x.x.x/32)
    AllowedPattern: '^(\d{1,3}\.){3}\d{1,3}/32$'
    ConstraintDescription: Must be a single host CIDR (x.x.x.x/32)
  ImageUri:
    Type: String
    Description: ECR image URI (repo:tag)
  SecretArn:
    Type: String
    Description: >-
      Secrets Manager secret (JSON with ANTHROPIC_API_KEY, PINECONE_API_KEY,
      VOYAGE_API_KEY, PP_API_TOKEN). Created by scripts/put_deploy_secret.py.
      ANTHROPIC_API_KEY may be empty when LlmProvider=bedrock (Bedrock
      authorizes via the instance profile, never an API key).
      PP_API_TOKEN authenticates n8n / Next.js BFF to the mesh (X-PP-Token).
  LlmProvider:
    Type: String
    # Demo default is bedrock (instance profile); anthropic needs a key in the secret.
    Default: bedrock
    # Every value quoted: unquoted `off` is a YAML-1.1 boolean and must never
    # be able to drift into `false` under a different parser.
    AllowedValues: ["off", "anthropic", "bedrock"]
    Description: >-
      PP_LLM for the agent service (off = deterministic only; bedrock uses
      the instance profile + BedrockModelId, no API key)
  BedrockModelId:
    Type: String
    # Claude 4.5 requires a cross-region inference profile (us.anthropic....);
    # on-demand foundation-model ids fail Converse with ValidationException.
    Default: us.anthropic.claude-sonnet-4-5-20250929-v1:0
    # Spliced into IAM Resource ARNs and the boot script: the pattern forbids
    # wildcards, quotes, $(), spaces and slashes so a parameter value can
    # neither broaden the grant nor inject into the root boot shell.
    AllowedPattern: '^[A-Za-z0-9][A-Za-z0-9.\-]*(:[0-9]+)?$'
    Description: >-
      PP_BEDROCK_MODEL_ID for the agent service when LlmProvider=bedrock.
      Prefer a cross-region inference profile id (us.anthropic....). See
      docs/DEPLOYMENT.md for the multi-region foundation-model IAM grant.
  RagBackend:
    Type: String
    Default: pinecone
    AllowedValues: [lexical, pinecone]
    Description: PP_RAG_BACKEND for the rag service
  InstanceType:
    Type: String
    Default: t3.medium
  AmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64

Conditions:
  UseBedrock: !Equals [!Ref LlmProvider, bedrock]

Resources:
  ServiceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: PETER PAN services - allowlisted CIDRs only, no SSH
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 8001, ToPort: 8005, CidrIp: !Ref DevIp }
        - { IpProtocol: tcp, FromPort: 8001, ToPort: 8005, CidrIp: !Ref N8nIp }
      Tags:
        - { Key: Name, Value: peter-pan-demo-sg }
        - { Key: project, Value: peter-pan }

  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: read-deploy-secret
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref SecretArn
        - PolicyName: ecr-pull-scoped
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # GetAuthorizationToken is account-scoped by the ECR API itself
              # (no resource-level permissions exist for it) — "*" here is the
              # correct/only form, not a broadening.
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"
              # Pull actions scoped to this stack's own repo only, derived from
              # the ImageUri parameter (repo name = path segment after the
              # registry host, tag stripped). Replaces the account-wide
              # AmazonEC2ContainerRegistryReadOnly managed policy.
              - Effect: Allow
                Action:
                  - ecr:BatchGetImage
                  - ecr:GetDownloadUrlForLayer
                  - ecr:BatchCheckLayerAvailability
                Resource:
                  !Sub
                    - "arn:aws:ecr:${AWS::Region}:${AWS::AccountId}:repository/${RepoName}"
                    - RepoName: !Select [0, !Split [":", !Select [1, !Split ["/", !Ref ImageUri]]]]
        - PolicyName: cloudwatch-logs-scoped
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                  - logs:DescribeLogStreams
                Resource:
                  - !GetAtt ServiceLogGroup.Arn
                  - !Sub "${ServiceLogGroup.Arn}:*"
        # Bedrock invocation, only when LlmProvider=bedrock. Converse is
        # authorized by bedrock:InvokeModel. Claude 4.5 uses a cross-region
        # inference profile id in BedrockModelId; the underlying foundation
        # model must also be granted in the profile's destination regions
        # (us-east-1/2 + us-west-2 for the us.* geo profile).
        - !If
          - UseBedrock
          - PolicyName: bedrock-invoke-scoped
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
                - Effect: Allow
                  Action:
                    - bedrock:InvokeModel
                    - bedrock:InvokeModelWithResponseStream
                  Resource:
                    - !Sub "arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/${BedrockModelId}"
                    - !Sub "arn:aws:bedrock:${AWS::Region}::foundation-model/${BedrockModelId}"
                    - arn:aws:bedrock:us-east-1::foundation-model/anthropic.claude-sonnet-4-5-20250929-v1:0
                    - arn:aws:bedrock:us-east-2::foundation-model/anthropic.claude-sonnet-4-5-20250929-v1:0
                    - arn:aws:bedrock:us-west-2::foundation-model/anthropic.claude-sonnet-4-5-20250929-v1:0
          - !Ref AWS::NoValue

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref InstanceRole]

  ServiceLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /peter-pan/demo
      RetentionInDays: 14
      Tags:
        - { Key: Name, Value: peter-pan-demo-logs }
        - { Key: project, Value: peter-pan }

  Instance:
    # Single EC2 instance running all five services — a documented demo-only
    # SPOF (no ASG/multi-AZ); acceptable for this demo stack, not for prod.
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: !Ref InstanceType
      ImageId: !Ref AmiId
      IamInstanceProfile: !Ref InstanceProfile
      SecurityGroupIds: [!GetAtt ServiceSecurityGroup.GroupId]
      MetadataOptions:
        # IMDSv2 only (token-optional v1 leaks the instance role to any
        # container-level SSRF), and hop limit 2 so bridge-networked
        # containers can reach IMDS at all — boto3 inside the agent container
        # resolves instance-profile credentials AND the region through IMDS;
        # at the default hop limit of 1 both fail and PP_LLM=bedrock dies
        # silently into the deterministic fallback.
        HttpEndpoint: enabled
        HttpTokens: required
        HttpPutResponseHopLimit: 2
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: 30
            VolumeType: gp3
            Encrypted: true
            DeleteOnTermination: true
      Tags:
        - { Key: Name, Value: peter-pan-demo }
        - { Key: project, Value: peter-pan }
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          # NO -x: xtrace would echo fetched secret values into the boot log.
          set -euo pipefail
          dnf install -y docker jq
          systemctl enable --now docker
          aws ecr get-login-password --region ${AWS::Region} \
            | docker login --username AWS --password-stdin ${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com

          SECRET_JSON=$(aws secretsmanager get-secret-value --region ${AWS::Region} \
            --secret-id "${SecretArn}" --query SecretString --output text)
          ANTHROPIC_API_KEY=$(echo "$SECRET_JSON" | jq -r '.ANTHROPIC_API_KEY // empty')
          PINECONE_API_KEY=$(echo "$SECRET_JSON" | jq -r '.PINECONE_API_KEY // empty')
          VOYAGE_API_KEY=$(echo "$SECRET_JSON" | jq -r '.VOYAGE_API_KEY // empty')
          PP_API_TOKEN=$(echo "$SECRET_JSON" | jq -r '.PP_API_TOKEN // empty')
          unset SECRET_JSON

          # Shared usage log: every service meters LLM calls into the same
          # host-mounted file so PETER PAN OS actually sees cross-service usage
          # (per-container files made /os/usage empty by construction).
          # Per-service data dirs: feedback/leads (ppos) and the prompt log
          # (agent) are stateful product data — they must survive container
          # recreation, and neither service may touch the other's files.
          # 1000 = the peterpan user's stable uid/gid (single useradd on
          # python:3.12-slim in the Dockerfile); 770 instead of 777 so only
          # the container user (and root) can touch the state dirs.
          install -d -m 770 -o 1000 -g 1000 \
            /opt/peterpan/usage /opt/peterpan/agent-data /opt/peterpan/ppos-data \
            /opt/peterpan/knowledge

          # Seed baked corpus into the host knowledge mount BEFORE rag starts.
          # An empty host dir mounted over /app/knowledge hides the image corpus
          # (corpus_size=0). Idempotent overwrite of baked docs only.
          docker pull ${ImageUri}
          docker run --rm -v /opt/peterpan/knowledge:/out ${ImageUri} \
            sh -c 'cp -a /app/knowledge/. /out/ && chown -R 1000:1000 /out'

          # Agent builds stories in-process (predict + search + synthesize) —
          # it needs PP_RAG_BACKEND + retrieval keys too, not only the rag service.
          # Bedrock authorizes via the instance profile (ANTHROPIC_API_KEY may be empty).
          # All services share PP_API_TOKEN when present (CIDR allowlist is not enough).
          # Container stdout/stderr → /peter-pan/demo (awslogs); host state stays on EBS.
          for entry in predictor:8001 rag:8002 guardrails:8003 agent:8004 ppos:8005; do
            svc="${!entry%%:*}"; port="${!entry##*:}"
            extra=()
            if [ -n "$PP_API_TOKEN" ]; then
              extra+=(-e "PP_API_TOKEN=$PP_API_TOKEN")
            fi
            if [ "$svc" = "agent" ]; then
              extra+=(-e "PP_LLM=${LlmProvider}" -e "ANTHROPIC_API_KEY=$ANTHROPIC_API_KEY" \
                      -e "PP_BEDROCK_MODEL_ID=${BedrockModelId}" \
                      -e "AWS_REGION=${AWS::Region}" \
                      -e "PP_AGENT_PROVIDER=local" \
                      -e "PP_RAG_BACKEND=${RagBackend}" \
                      -e "PINECONE_API_KEY=$PINECONE_API_KEY" \
                      -e "VOYAGE_API_KEY=$VOYAGE_API_KEY" \
                      -v /opt/peterpan/agent-data:/app/data)
            elif [ "$svc" = "rag" ]; then
              extra+=(-e "PP_RAG_BACKEND=${RagBackend}" \
                      -e "PINECONE_API_KEY=$PINECONE_API_KEY" \
                      -e "VOYAGE_API_KEY=$VOYAGE_API_KEY" \
                      -v /opt/peterpan/knowledge:/app/knowledge)
            elif [ "$svc" = "ppos" ]; then
              extra+=(-v /opt/peterpan/ppos-data:/app/data)
            fi
            docker run -d --restart unless-stopped --name "$svc" \
              --log-driver awslogs \
              --log-opt awslogs-region=${AWS::Region} \
              --log-opt awslogs-group=/peter-pan/demo \
              --log-opt awslogs-stream="$svc" \
              --health-cmd "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8000/healthz',timeout=3)\"" \
              --health-interval 30s --health-timeout 5s --health-retries 3 \
              -e SERVICE="$svc" -e PP_ENV=mirage \
              -e PP_USAGE_LOG_PATH=/app/usage-shared/usage.jsonl \
              -v /opt/peterpan/usage:/app/usage-shared "${!extra[@]}" \
              -p "$port":8000 ${ImageUri}
          done
          unset ANTHROPIC_API_KEY PINECONE_API_KEY VOYAGE_API_KEY PP_API_TOKEN

  StatusCheckFailedAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: peter-pan-demo-status-check-failed
      AlarmDescription: EC2 instance status check failed (demo mesh host)
      Namespace: AWS/EC2
      MetricName: StatusCheckFailed
      Dimensions:
        - Name: InstanceId
          Value: !Ref Instance
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 2
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      Tags:
        - { Key: Name, Value: peter-pan-demo-status-check }
        - { Key: project, Value: peter-pan }

  HighCpuAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: peter-pan-demo-cpu-high
      AlarmDescription: Demo host CPU > 85% for 10 minutes
      Namespace: AWS/EC2
      MetricName: CPUUtilization
      Dimensions:
        - Name: InstanceId
          Value: !Ref Instance
      Statistic: Average
      Period: 300
      EvaluationPeriods: 2
      Threshold: 85
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      Tags:
        - { Key: Name, Value: peter-pan-demo-cpu }
        - { Key: project, Value: peter-pan }

Outputs:
  PublicIp:
    Value: !GetAtt Instance.PublicIp
  PublicDns:
    Value: !GetAtt Instance.PublicDnsName
  InstanceId:
    Value: !Ref Instance
  SecurityGroupId:
    Value: !GetAtt ServiceSecurityGroup.GroupId
  LogGroupName:
    Value: !Ref ServiceLogGroup
