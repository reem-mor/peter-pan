AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  PETER PAN demo stack: one EC2 instance running the five services from ECR.
  No SSH ingress (SSM Session Manager only); service ports restricted to two
  allowlisted CIDRs. Delete the stack to tear everything down.

Parameters:
  DevIp:
    Type: String
    Description: Developer public IP in CIDR form (x.x.x.x/32)
  N8nIp:
    Type: String
    Description: n8n egress IP in CIDR form (x.x.x.x/32)
  ImageUri:
    Type: String
    Description: ECR image URI (repo:tag)
  SecretArn:
    Type: String
    Description: >-
      Secrets Manager secret (JSON with ANTHROPIC_API_KEY, PINECONE_API_KEY,
      VOYAGE_API_KEY). Created by scripts/put_deploy_secret.py.
  LlmProvider:
    Type: String
    Default: anthropic
    AllowedValues: [off, anthropic]
    Description: PP_LLM for the agent service (off = deterministic only)
  RagBackend:
    Type: String
    Default: pinecone
    AllowedValues: [lexical, pinecone]
    Description: PP_RAG_BACKEND for the rag service
  InstanceType:
    Type: String
    Default: t3.medium
  AmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64

Resources:
  ServiceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: PETER PAN services - allowlisted CIDRs only, no SSH
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 8001, ToPort: 8005, CidrIp: !Ref DevIp }
        - { IpProtocol: tcp, FromPort: 8001, ToPort: 8005, CidrIp: !Ref N8nIp }

  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: read-deploy-secret
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref SecretArn
        - PolicyName: ecr-pull-scoped
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # GetAuthorizationToken is account-scoped by the ECR API itself
              # (no resource-level permissions exist for it) — "*" here is the
              # correct/only form, not a broadening.
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"
              # Pull actions scoped to this stack's own repo only, derived from
              # the ImageUri parameter (repo name = path segment after the
              # registry host, tag stripped). Replaces the account-wide
              # AmazonEC2ContainerRegistryReadOnly managed policy.
              - Effect: Allow
                Action:
                  - ecr:BatchGetImage
                  - ecr:GetDownloadUrlForLayer
                  - ecr:BatchCheckLayerAvailability
                Resource:
                  !Sub
                    - "arn:aws:ecr:${AWS::Region}:${AWS::AccountId}:repository/${RepoName}"
                    - RepoName: !Select [0, !Split [":", !Select [1, !Split ["/", !Ref ImageUri]]]]

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref InstanceRole]

  Instance:
    # Single EC2 instance running all five services — a documented demo-only
    # SPOF (no ASG/multi-AZ); acceptable for this demo stack, not for prod.
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: !Ref InstanceType
      ImageId: !Ref AmiId
      IamInstanceProfile: !Ref InstanceProfile
      SecurityGroupIds: [!GetAtt ServiceSecurityGroup.GroupId]
      Tags:
        - { Key: Name, Value: peter-pan-demo }
        - { Key: project, Value: peter-pan }
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          # NO -x: xtrace would echo fetched secret values into the boot log.
          set -euo pipefail
          dnf install -y docker jq
          systemctl enable --now docker
          aws ecr get-login-password --region ${AWS::Region} \
            | docker login --username AWS --password-stdin ${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com

          SECRET_JSON=$(aws secretsmanager get-secret-value --region ${AWS::Region} \
            --secret-id "${SecretArn}" --query SecretString --output text)
          ANTHROPIC_API_KEY=$(echo "$SECRET_JSON" | jq -r '.ANTHROPIC_API_KEY // empty')
          PINECONE_API_KEY=$(echo "$SECRET_JSON" | jq -r '.PINECONE_API_KEY // empty')
          VOYAGE_API_KEY=$(echo "$SECRET_JSON" | jq -r '.VOYAGE_API_KEY // empty')
          unset SECRET_JSON

          # Shared usage log: every service meters LLM calls into the same
          # host-mounted file so PETER PAN OS actually sees cross-service usage
          # (per-container files made /os/usage empty by construction).
          mkdir -p /opt/peterpan/usage && chmod 777 /opt/peterpan/usage

          # Least privilege per service: only agent sees the Anthropic key,
          # only rag sees the retrieval keys. Everything else runs key-less.
          for entry in predictor:8001 rag:8002 guardrails:8003 agent:8004 ppos:8005; do
            svc="${!entry%%:*}"; port="${!entry##*:}"
            extra=()
            if [ "$svc" = "agent" ]; then
              extra+=(-e "PP_LLM=${LlmProvider}" -e "ANTHROPIC_API_KEY=$ANTHROPIC_API_KEY")
            elif [ "$svc" = "rag" ]; then
              extra+=(-e "PP_RAG_BACKEND=${RagBackend}" \
                      -e "PINECONE_API_KEY=$PINECONE_API_KEY" \
                      -e "VOYAGE_API_KEY=$VOYAGE_API_KEY")
            fi
            docker run -d --restart unless-stopped --name "$svc" \
              -e SERVICE="$svc" -e PP_ENV=mirage \
              -e PP_USAGE_LOG_PATH=/app/usage-shared/usage.jsonl \
              -v /opt/peterpan/usage:/app/usage-shared "${!extra[@]}" \
              -p "$port":8000 ${ImageUri}
          done

Outputs:
  PublicIp:
    Value: !GetAtt Instance.PublicIp
  PublicDns:
    Value: !GetAtt Instance.PublicDnsName
