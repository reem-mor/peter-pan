[project]
name = "peter-pan"
version = "0.1.0"
description = "PETER PAN — Predictive, Agentic Navigator. Incident intelligence: evidence collection, story-building, and human-approved remediation."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
ui = ["streamlit>=1.38"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5", "mypy>=1.10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/peterpan"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
python_version = "3.11"

[[tool.mypy.overrides]]
module = ["streamlit.*"]
ignore_missing_imports = true
