[project]
name = "peter-pan"
version = "0.1.0"
description = "PETER PAN — Predictive, Agentic Navigator. Incident intelligence: evidence collection, story-building, and human-approved remediation."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
ui = ["streamlit>=1.38"]
agents = ["langgraph>=0.2"]
ml = ["torch>=2.4"]
llm = ["anthropic>=0.40"]
aws = ["boto3>=1.34"]
rag = ["pinecone>=5.0", "voyageai>=0.2"]
cache = ["redis>=5"]
nemo = ["nemoguardrails>=0.11"]
obs = ["langfuse>=2"]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "diff-cover>=9",
    "httpx>=0.27",
    "ruff>=0.5",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/peterpan"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
python_version = "3.12"

[[tool.mypy.overrides]]
# torch stays here (unlike anthropic/langgraph) because its wheel is too heavy
# to install in CI just for type stubs; the import is lazy behind the ml extra.
# redis (cache extra), nemoguardrails (nemo extra), and langfuse (obs extra)
# are all lazy imports behind optional extras — none ship usable stubs.
module = [
    "streamlit.*",
    "voyageai.*",
    "pinecone.*",
    "torch.*",
    "redis.*",
    "nemoguardrails.*",
    "langfuse.*",
    "boto3.*",
]
ignore_missing_imports = true
follow_imports = "skip"
